<body>
    <nav class="navBar">
           <div class="navBrand">[ (NAME) MERCH ]</div>

                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">Catalog</a></li>

              <a class="cartBtn" href="Cart/cart.html"aria-label="Cart">

    <div class="formWrapper" id="formWrapper">
        <form id="userFormRegistration" class="userFormRegistration">
            <label for="username">Username</label>
            <input type="text" class="userInfoInput" id="username">

            <label for="password">Password</label>
            <input type="text" class="userInfoInput" id="password">

            <label for="email">email</label>
            <input type="text" class="userInfoInput" id="email">
            <button type="submit" id="userFormSubmit">Submit</button>

            <br>
        
            <p>Already have an account?</p><a id="loginButton" href="">click here to LogIn</a>
            <p class="status" id="registrationStatus"></p>
        </form>

        <form id="userFormLogin">
            <label for="username">Username</label>
            <input type="text" class="userInfoInput" id="userLoginInput">

            <label for="password">Password</label>
            <input type="text" class="userInfoInput" id="passwordLoginInput">

            <button type="submit" id="userLoginSubmit">Submit</button>

            <br>
        
            <p>Don't have an account?</p><a href="" id="registrationButton">click here to Register</a>
            <p class="status" id="loginStatus"></p>
        </form>




        <form id="userFormAddress">
            <h2>Address:</h2>
            <br>
            <label for="unitNum"> Unit Number N/A if none</label>
            <input type="text" class="addressInput" id="unitNum">

            <label for="streetName"> Street Name N/A if none</label>
            <input type="text" class="addressInput" id="streetName">

            <label for="barangay"> Barangay N/A if none</label>
            <input type="text" class="addressInput" id="barangay">

            <label for="city_municipality"> City Municipality N/A if none</label>
            <input type="text" class="addressInput" id="city_municipality">

            <label for="province"> Province N/A if none</label>
            <input type="text" class="addressInput" id="province">

            <label for="postal_zip"> Postal Zip Number N/A if none</label>
            <input type="text" class="addressInput" id="postal_zip">

            <button type="submit" id="userFormAddressSubmit"> Submit</button>
            <p class="status" id="addressStatus"></p>

        </form>
    </div>


    <!--THIS IS FOR USER INFO!!!--> 
    <div class="profileWrapper" id="userInfo">
        <div class="userInfoProfile"><h1 id="profilePic"></h1></div>

    </div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="userAccount.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Splash&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Splash&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navigator">
        <h1 class="companyName">CozzyShop</h1>
        <div class="navChild">
            <a href="#">ABOUT</a>
            <a href="#">CONTACT</a>
            <a href="#">RATE</a>
            <a href="../UserInterface.html">HOME</a>

        </div>
    </nav>

    <div class="formWrapper" id="formWrapper">
        <form id="userFormRegistration">
            <label for="username">Username</label>
            <input type="text" class="username" id="username">

            <label for="email">Email</label>
            <input type="text" class="email" id="email">

            <label for="phone">Phone Number</label>
            <input type="text" class="phone" id="phone">
            <button type="submit" id="userFormSubmit">Submit</button>
            <p id="status"></p>
        </form>




        <form id="userFormAddress">
            <h2>Address:</h2>
            <br>
            <label for="unitNum"> Unit Number N/A if none</label>
            <input type="text" class="unitNum" id="unitNum">

            <label for="streetName"> Street Name N/A if none</label>
            <input type="text" class="streetName" id="streetName">

            <label for="barangay"> Barangay N/A if none</label>
            <input type="text" class="barangay" id="barangay">

            <label for="city_municipality"> City Municipality N/A if none</label>
            <input type="text" class="city_municipality" id="city_municipality">

            <label for="province"> Province N/A if none</label>
            <input type="text" class="province" id="province">

            <label for="postal_zip"> Postal Zip Number N/A if none</label>
            <input type="text" class="postal_zip" id="postal_zip">

            <button type="submit" id="userFormAddressSubmit"> Submit</button>
            <p id="status"></p>

        </form>
    </div>


<div class="userInfoWrapper" id="userInfoWrapper">

    <div class="userInfoChild">
        <a class="userProfile" id="userProfile">
            <h2 id="userProfilePic"></h2>
        </a>
        <h2 class="userProfileName" id="userProfileName"></h2>
        
    </div>

    <div class="address-container">
        <h2 class="infoHeaders" id="addressInfo">Address</h2>

        <dl>
            <dt class="infoHeaders">Unit Number</dt>
            
                <dd id="unitNumInfo" >
                    <span id="unitNumText"></span>
                    <button>+</button>
                </dd>
            
            <dt class="infoHeaders">Barangay</dt>
            
                <dd id="barangayInfo">
                    <span id="barangayText"></span>
                    <button>+</button>
                </dd>
            
            <dt class="infoHeaders">Street Name</dt>
            
                <dd id="streetNameInfo">
                    <span id="streetNameText"></span>
                    <button>+</button>
                </dd>
            
            <dt class="infoHeaders" >City/Municipality</dt>
            
                <dd id="cityMunicipalityInfo">
                    <span id="cityMunicipalityText"></span>
                    <button>+</button>
                </dd>
            
            <dt class="infoHeaders">Province</dt>
            
                <dd id="provinceInfo">
                    <span id="provinceText"></span>
                    <button>+</button>
                </dd>
            
            <dt class="infoHeaders">Postal/ZIP Code</dt>
            
                <dd id="postalZipInfo">
                    <span id="postalZipText"></span>
                    <button>+</button>
                </dd>
        </dl>
    </div>      
</div>

    

<script type="module" src="userAccount.js"></script>


</body>

</html>

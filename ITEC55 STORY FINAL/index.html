<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <title>Something Website</title>
</head>
<body>
  <div class="storeContainer">
        <nav class="navBar">
           <div class="navBrand">[ (NAME) MERCH ]</div>
              <ul class="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Catalog</a></li>
                <li><a href="contact.html">Collections</a></li>
                <li><a href="about.html">About</a></li>
              </ul>

            <div class="navActions">
              <input type="text" placeholder="⌕ Search item...">
              <a class="cart-btn" href="cart.html"aria-label="Cart">
              <img src="images/cart.png" alt="cartIcon">
              </a>
              <button class="prof-btn" type="button">Profile</button>
            </div>
        </nav>

      <div class="underDashBanner">
          <img src="images/clothesBG.jfif" alt="clothesBG" class="underDashImage">
        <div class="underDashText">
          <h1>LIMITED EDITION DROPS: (NAME) MERCHANDISE AVAILABLE NOW!</h1>
          <p>High-performance apparel and gear engineered for casual and professional use.</p>
          <button class="expButton">EXPLORE MERCH</Button>
        </div>
      </div>

      <section class="productSection">
        <div class="categoryFilters">
          <button class="filterBtnActive">All</button>
          <button class="filterBtn">Hoodies</button>
          <button class="filterBtn">Tees</button>
          <button class="filterBtn">Accessories</button>
          <button class="filterBtn">Collectibles</button>
        </div>

        <div class="productGrid">
          <div class="productCard">
            <div class="imageContainer">
              <img src="images/clothes1.jfif" alt="clothes1Img">
            </div>
            <div class="productInfo">
              <h3>Product Name</h3>
              <p>$29.99</p>
              <button class="addToCartBtn">Add to Cart</button>
            </div>
          </div>

          <div class="productCard">
            <div class="imageContainer">
              <img src="images/clothes2.jfif" alt="clothes2Img">
            </div>
            <div class="productInfo">
              <h3>Product Name</h3>
              <p>$29.99</p>
              <button class="addToCartBtn">Add to Cart</button>
          </div>
        </div>

        <div class="productCard">
            <div class="imageContainer">
              <img src="images/clothes3.jfif" alt="clothes3Img">
            </div>
            <div class="productInfo">
              <h3>Product Name</h3>
              <p>$29.99</p>
              <button class="addToCartBtn">Add to Cart</button>
          </div>

    </div>
</body>
</html>
